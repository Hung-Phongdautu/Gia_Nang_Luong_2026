<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tra cứu giá năng lượng 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef5fb;color:#123}
main{max-width:560px;margin:auto;padding:18px 14px 40px}
.hero{background:linear-gradient(135deg,#0b5d96,#1683c7);color:#fff;padding:20px;border-radius:22px}
.hero h1{margin:0 0 6px;font-size:24px} .hero p{margin:0;opacity:.9;font-size:14px}
.card{background:#fff;margin-top:14px;padding:16px;border-radius:20px;box-shadow:0 8px 24px rgba(15,68,100,.08)}
label{display:block;font-size:12px;font-weight:700;color:#486581;margin-bottom:6px}
input,select,button{width:100%;padding:13px;border-radius:12px;font-size:16px}
input,select{border:1px solid #c9dce9;background:#fff}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:10px}
button{margin-top:12px;border:0;background:#0b67a3;color:#fff;font-weight:900}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:#e8f3fb;color:#0b5d96;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}
table{width:100%;border-collapse:collapse;margin-top:8px}
td{padding:11px 2px;border-bottom:1px solid #edf2f7;font-size:14px}
td:last-child{text-align:right;font-weight:800}
.electric{margin-top:14px;padding:14px;border-radius:15px;background:#f1f8fd}
.price{font-size:23px;font-weight:900;color:#0b5d96}
.small{font-size:12px;color:#627d98;line-height:1.45;margin-top:4px}
.hidden{display:none}
.error{color:#b42318;font-weight:700;font-size:13px;margin-top:10px}
.ok{color:#177245;font-weight:700;font-size:13px;margin-top:10px}
.back{background:#6b7c8f}
</style>
</head>
<body>
<main>
<section class="hero">
  <h1>Giá năng lượng 2026</h1>
  <p>Tra cứu xăng dầu Petrolimex và giá điện dùng cho ca máy</p>
</section>

<section class="card" id="searchCard">
  <div class="grid">
    <div>
      <label>Ngày tra cứu</label>
      <input id="dateText" type="date" min="2026-01-01" max="2026-09-07" value="2026-08-06">
    </div>
    <div>
      <label>Khu vực</label>
      <select id="region">
        <option value="v1">Vùng 1</option>
        <option value="v2">Vùng 2</option>
      </select>
    </div>
  </div>
  <button id="lookupBtn" type="button">TRA CỨU GIÁ</button>
  <div id="msg" class="small">Chạm vào ô ngày để nhập hoặc chọn ngày.</div>
</section>

<section class="card hidden" id="resultCard">
  <div class="meta">
    <div>
      <strong id="resultDate"></strong>
      <div id="effective" class="small"></div>
    </div>
    <span id="regionLabel" class="pill"></span>
  </div>
  <table><tbody id="fuelRows"></tbody></table>
  <div class="electric">
    <div class="small">GIÁ ĐIỆN DÙNG CHO CA MÁY</div>
    <div id="electricPrice" class="price"></div>
    <div id="electricInfo" class="small"></div>
    <div id="electricLegal" class="small"></div>
  </div>
  <button id="backBtn" type="button" class="back">TRA CỨU LẠI</button>
</section>
</main>

const PRODUCTS = [["e10_ron95_v", "Xăng E10 RON 95-V"], ["e10_ron95_iii", "Xăng E10 RON 95-III"], ["e5_ron92_ii", "Xăng E5 RON 92-II"], ["do_0001s_v", "DO 0,001S-V"], ["do_005s_ii", "DO 0,05S-II"], ["dau_hoa_2k", "Dầu hỏa 2-K"]];

function fmtMoney(v) {
  if (v === null || v === undefined) return "Chưa có dữ liệu";
  return new Intl.NumberFormat("vi-VN").format(v) + " đ";
}

function parseDateVN(s) {
  s = (s || "").trim();
  if (!/^2026-\d{2}-\d{2}$/.test(s)) return null;
  const dt = new Date(s + "T00:00:00");
  if (isNaN(dt.getTime()) || dt.getFullYear() !== 2026) return null;
  return s;
}

function fmtDate(iso) {
  return iso.slice(8,10) + "/" + iso.slice(5,7) + "/" + iso.slice(0,4);
}

function traCuu() {
  const input = document.getElementById("dateText").value;
  const iso = parseDateVN(input);
  const msg = document.getElementById("msg");

  if (!iso) {
    msg.className = "error";
    msg.textContent = "Ngày không hợp lệ. Vui lòng chọn ngày trong năm 2026.";
    return;
  }

  const fuel = DB.fuel[iso];
  const elec = DB.electricity[iso];
  if (!fuel && !elec) {
    msg.className = "error";
    msg.textContent = "Không có dữ liệu tại ngày " + input + ".";
    return;
  }

  const region = document.getElementById("region").value;
  document.getElementById("resultDate").textContent = fmtDate(iso);
  document.getElementById("regionLabel").textContent = region === "v1" ? "Vùng 1" : "Vùng 2";
  document.getElementById("effective").textContent =
    fuel ? "Mốc giá áp dụng: " + fmtDate(fuel.effective_from) : "";

  let rows = "";
  PRODUCTS.forEach(function(item) {
    const val = fuel && fuel[item[0]] ? fuel[item[0]][region] : null;
    rows += "<tr><td>"+item[1]+"</td><td>"+fmtMoney(val)+"</td></tr>";
  });
  document.getElementById("fuelRows").innerHTML = rows;

  if (elec) {
    document.getElementById("electricPrice").textContent = fmtMoney(elec.price) + "/kWh";
    document.getElementById("electricInfo").textContent =
      elec.group + " · " + elec.voltage + " · " + elec.period;
    document.getElementById("electricLegal").textContent =
      elec.decision + " · hiệu lực " + fmtDate(elec.effective_from);
  }

  document.getElementById("searchCard").classList.add("hidden");
  document.getElementById("resultCard").classList.remove("hidden");
}

document.getElementById("lookupBtn").addEventListener("click", traCuu);
document.getElementById("backBtn").addEventListener("click", function() {
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("searchCard").classList.remove("hidden");
});
</script>
